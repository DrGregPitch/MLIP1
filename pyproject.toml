[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlip1"
version = "0.1.0"
description = "MLIP active-learning fine-tuning: a committee of fine-tuned interatomic potentials selects which structures to label, on the deployment-regime metric that actually matters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mlip", "interatomic-potential", "active-learning", "mace", "atomistic", "materials"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]

# Core deps are light enough for CI. The MACE foundation model (the expensive
# oracle) is an optional extra so the package installs and tests without the
# heavy download; only the full AL runs need it.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "ase>=3.24",
    "torch>=2.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
mace = ["mace-torch>=0.3.16"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/DrGregPitch/MLIP1"

[tool.hatch.build.targets.wheel]
packages = ["mlip1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["mlip1", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501", "B905", "C408"]
