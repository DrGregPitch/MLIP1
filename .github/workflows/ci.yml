name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
concurrency: {group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: {fail-fast: false, matrix: {python-version: ["3.10", "3.11", "3.12"]}}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with: {enable-cache: true, cache-dependency-glob: "**/pyproject.toml"}
      - name: Create env and install (base + dev; MACE extra intentionally omitted so CI stays light)
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check mlip1 tests scripts
      - name: Test (MACE-oracle tests skip without the [mace] extra)
        run: uv run pytest tests -v
